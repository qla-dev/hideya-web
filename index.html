<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />

    <meta property="og:type" content="website" />

    <meta property="og:title" content="Hideya: Make outside your next adventure" />
    <meta property="og:description" content="Round up your friends for a city-sized game of hiding, chasing and clever escapes. Meet Hideya for iPhone and Android." />
    <meta property="og:url" content="https://qla.dev/hideya/" />
    <meta property="og:image" content="https://qla.dev/hideya/assets/hideya/hideya-original.png" />

    <link rel="manifest" href="%BASE_URL%site.webmanifest" />
    <title>Hideya: Make outside your next adventure</title>
    <script type="module" src="./src/main.tsx"></script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>Hideya’s interactive site needs JavaScript. Run “pnpm dev” from the web folder to preview the editable React source.</noscript>
    <script>
      // An IDE static server cannot compile TSX. Show the complete compiled React
      // page instead; Vite development and production never take this branch.
      if (document.querySelector('script[src="./src/main.tsx"]') && !document.querySelector('script[src*="/@vite/client"]')) {
        if (location.protocol !== 'file:') location.replace(new URL('./dist/index.html', location.href));
        else document.getElementById('root').textContent = 'Open http://127.0.0.1:8082 or run pnpm dev from the web folder to preview Hideya.';
      }
    </script>
  </body>
</html>
